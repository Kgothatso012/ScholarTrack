name: Release

# Gated production release. Two jobs:
#   1. supabase-migrate — applies supabase/migrations/* (incl. 014 RLS lockdown)
#      to the production project before any build ships.
#   2. build-android   — runs `expo prebuild` (applies the withAndroidSecurity
#      config plugin), then a LOCAL Gradle release build on the runner signed
#      with the dedicated upload keystore, and FAILS if the resulting AAB is
#      signed with the Android debug key or the wrong production cert.
#      It also validates required secrets up-front and verifies that
#      EXPO_PUBLIC_* env vars were inlined into the JS bundle.
#
# The release keystore is injected as a file from a base64 GitHub secret, so the
# plugin's SCHOLARTRACK_UPLOAD_* env vars resolve to a real file on the runner.
# (For EAS *cloud* builds, use EAS Credentials instead — see docs/RELEASE.md.)

on:
  workflow_dispatch:
    inputs:
      supabase_migrate:
        description: "Run `supabase db push` before building"
        type: boolean
        default: true
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  supabase-migrate:
    name: Apply Supabase migrations (RLS lockdown)
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.supabase_migrate != 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        run: npm i -g supabase@latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Preview migration diff (dry run)
        run: supabase db push --dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Apply migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

  build-android:
    name: Build & verify signed production AAB
    runs-on: ubuntu-latest
    needs: supabase-migrate
    if: always() && (needs.supabase-migrate.result == 'success' || needs.supabase-migrate.result == 'skipped')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK (build-tools for apksigner)
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0'

      - name: Validate required GitHub secrets
        env:
          KEYSTORE_B64: ${{ secrets.SCHOLARTRACK_UPLOAD_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.SCHOLARTRACK_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SCHOLARTRACK_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SCHOLARTRACK_UPLOAD_KEY_PASSWORD }}
          SB_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SB_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -e
          missing=0
          [ -z "$KEYSTORE_B64" ]    && echo "::error::Missing: SCHOLARTRACK_UPLOAD_KEYSTORE_B64"    && missing=1
          [ -z "$STORE_PASSWORD" ]  && echo "::error::Missing: SCHOLARTRACK_UPLOAD_STORE_PASSWORD"  && missing=1
          [ -z "$KEY_ALIAS" ]       && echo "::error::Missing: SCHOLARTRACK_UPLOAD_KEY_ALIAS"       && missing=1
          [ -z "$KEY_PASSWORD" ]    && echo "::error::Missing: SCHOLARTRACK_UPLOAD_KEY_PASSWORD"    && missing=1
          [ -z "$SB_ACCESS_TOKEN" ] && echo "::error::Missing: SUPABASE_ACCESS_TOKEN"              && missing=1
          [ -z "$SB_PROJECT_REF" ]  && echo "::error::Missing: SUPABASE_PROJECT_REF"               && missing=1
          if [ "$missing" -ne 0 ]; then
            echo "::error::One or more required GitHub secrets are not set. Add them in Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "OK: all required secrets present."

      - name: Decode release keystore from secret
        run: |
          printf '%s' "${{ secrets.SCHOLARTRACK_UPLOAD_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          test -s "$RUNNER_TEMP/upload.keystore" || { echo "keystore secret empty"; exit 1; }
          echo "RUNNER_KEYSTORE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"

      - name: expo prebuild (applies security config plugin)
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}

      - name: Gradle release build (signed with upload keystore)
        working-directory: android
        run: ./gradlew bundleRelease -x lint
        env:
          SCHOLARTRACK_UPLOAD_KEYSTORE_PATH: ${{ env.RUNNER_KEYSTORE }}
          SCHOLARTRACK_UPLOAD_STORE_PASSWORD: ${{ secrets.SCHOLARTRACK_UPLOAD_STORE_PASSWORD }}
          SCHOLARTRACK_UPLOAD_KEY_ALIAS: ${{ secrets.SCHOLARTRACK_UPLOAD_KEY_ALIAS }}
          SCHOLARTRACK_UPLOAD_KEY_PASSWORD: ${{ secrets.SCHOLARTRACK_UPLOAD_KEY_PASSWORD }}
          # EXPO_PUBLIC_* vars are inlined by Metro during JS bundling inside
          # this Gradle task — they must be on THIS step, not just on prebuild.
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}

      - name: Locate AAB
        id: aab
        run: |
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab | head -1)
          test -s "$AAB" || { echo "no AAB produced"; exit 1; }
          echo "path=$AAB" >> "$GITHUB_OUTPUT"

      - name: Verify signing cert matches expected production key
        run: |
          set -e
          keytool -printcert -jarfile "${{ steps.aab.outputs.path }}" > certs.txt 2>&1 || { cat certs.txt; exit 1; }
          echo "::group::Signing certificates"; cat certs.txt; echo "::endgroup::"
          # 1. Reject the Android debug key.
          if grep -q "CN=Android Debug" certs.txt; then
            echo "FATAL: build is signed with the Android DEBUG keystore — do not ship."; exit 1
          fi
          # 2. Assert the expected production cert SHA-256 fingerprint is present.
          EXPECTED=$(echo -n "${{ secrets.SCHOLARTRACK_UPLOAD_CERT_SHA256 }}" | tr -d '[:space:]')
          if [ -n "$EXPECTED" ]; then
            if ! grep -qi "SHA256:$EXPECTED" certs.txt; then
              echo "FATAL: signing cert SHA-256 mismatch — the AAB was signed with an unexpected key."
              echo "  Expected SHA256: $EXPECTED"
              exit 1
            fi
            echo "OK: signing cert SHA-256 matches the expected production fingerprint."
          else
            echo "WARN: SCHOLARTRACK_UPLOAD_CERT_SHA256 secret not set — cert fingerprint check skipped (debug-key rejection still active)."
          fi
          echo "OK: production build is signed with the correct keystore."

      - name: Verify EXPO_PUBLIC_* vars inlined into bundle
        run: |
          set -e
          AAB="${{ steps.aab.outputs.path }}"
          BUNDLE=$(unzip -l "$AAB" | grep 'index.android.bundle' | awk '{print $NF}' | head -1)
          if [ -z "$BUNDLE" ]; then
            echo "FATAL: index.android.bundle not found inside the AAB."; exit 1
          fi
          unzip -p "$AAB" "$BUNDLE" > bundle.js
          # Check that the Supabase URL was inlined (not left as undefined).
          if ! grep -q 'supabase.co' bundle.js; then
            echo "FATAL: EXPO_PUBLIC_SUPABASE_URL was not inlined into the JS bundle."
            exit 1
          fi
          echo "OK: Supabase URL found in bundle."
          # If the Maps key secret is set, verify it (or the app.json fallback) is inlined.
          MAPS_KEY="${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}"
          if [ -n "$MAPS_KEY" ] && ! grep -q 'AIza' bundle.js; then
            echo "FATAL: Google Maps API key was not inlined into the JS bundle."
            exit 1
          fi
          echo "OK: bundle content verification passed."
          rm -f bundle.js

      - uses: actions/upload-artifact@v4
        with:
          name: android-production-aab
          path: ${{ steps.aab.outputs.path }}
          if-no-files-found: error
