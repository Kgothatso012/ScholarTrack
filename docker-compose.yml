version: '3.8'

services:
  app:
    build: .
    container_name: scholartrack-dev
    ports:
      - "8081:8081"
      - "8098:8098"
    environment:
      - NODE_ENV=development
      - EXPO_PUBLIC_SUPABASE_URL=${EXPO_PUBLIC_SUPABASE_URL}
      - EXPO_PUBLIC_SUPABASE_ANON_KEY=${EXPO_PUBLIC_SUPABASE_ANON_KEY}
    volumes:
      - .:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    command: npm start
