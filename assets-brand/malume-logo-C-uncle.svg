<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- MALUME LOGO — CONCEPT C: "The Uncle" -->
  <!-- Warm amber tile, friendly driver silhouette + wordmark -->
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#amber)"/>
  <!-- cap -->
  <path d="M 196 168 A 60 54 0 0 1 316 168 L 316 182 L 196 182 Z" fill="#1E293B"/>
  <rect x="180" y="176" width="140" height="18" rx="9" fill="#1E293B"/>
  <!-- head -->
  <circle cx="256" cy="238" r="52" fill="#1E293B"/>
  <!-- smile -->
  <path d="M 236 250 Q 256 268 276 250" fill="none" stroke="#F59E0B" stroke-width="8" stroke-linecap="round"/>
  <!-- shoulders -->
  <path d="M 150 372 C 150 306 196 288 256 288 C 316 288 362 306 362 372 Z" fill="#1E293B"/>
  <!-- thumbs-up arm -->
  <rect x="330" y="252" width="26" height="58" rx="13" fill="#1E293B" transform="rotate(24 343 281)"/>
  <circle cx="362" cy="248" r="15" fill="#1E293B"/>
  <!-- wordmark -->
  <text x="256" y="438" text-anchor="middle" fill="#FFFFFF"
        font-family="DejaVu Sans, Verdana, sans-serif" font-weight="bold" font-size="64"
        letter-spacing="2">Malume</text>
</svg>
