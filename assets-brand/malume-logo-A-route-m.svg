<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- MALUME LOGO — CONCEPT A: "The Route M" -->
  <!-- Road-shaped M monogram with dashed centre line + destination pin -->
  <rect width="512" height="512" rx="112" fill="#1E293B"/>
  <path d="M 128 400 L 152 150 L 256 316 L 360 150 L 384 400"
        fill="none" stroke="#F59E0B" stroke-width="46"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 128 400 L 152 150 L 256 316 L 360 150 L 384 400"
        fill="none" stroke="#FFFFFF" stroke-width="6"
        stroke-dasharray="20 16" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- destination pin above the route -->
  <g transform="translate(256,96)">
    <path d="M 0 44 C -22 20 -26 6 -26 -6 A 26 26 0 1 1 26 -6 C 26 6 22 20 0 44 Z" fill="#F59E0B"/>
    <circle cx="0" cy="-6" r="11" fill="#1E293B"/>
  </g>
</svg>
