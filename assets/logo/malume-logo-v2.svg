<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <style>
      .navy { fill: #1E3A5F; }
      .orange { fill: #E8871A; }
      .green { fill: #2E8B57; }
      .white { fill: #FFFFFF; }
    </style>
  </defs>
  <rect width="1024" height="1024" fill="#FFFFFF"/>

  <!-- Dashed route arc -->
  <path d="M 200 340 Q 512 140 824 340" fill="none" stroke="#1E3A5F" stroke-width="14" stroke-dasharray="30 24" stroke-linecap="round"/>

  <!-- Blue pin: home -->
  <g transform="translate(200,340)">
    <path d="M 0 -80 C -44 -80 -80 -44 -80 0 C -80 56 0 120 0 120 C 0 120 80 56 80 0 C 80 -44 44 -80 0 -80 Z" fill="#2563EB"/>
    <path d="M -28 -8 L 0 -32 L 28 -8 L 28 24 L -28 24 Z" fill="#FFFFFF"/>
    <rect x="-6" y="6" width="12" height="18" fill="#2563EB"/>
  </g>

  <!-- Orange pin: bus -->
  <g transform="translate(512,180)">
    <path d="M 0 -80 C -44 -80 -80 -44 -80 0 C -80 56 0 120 0 120 C 0 120 80 56 80 0 C 80 -44 44 -80 0 -80 Z" fill="#E8871A"/>
    <rect x="-38" y="-38" width="76" height="56" rx="10" fill="#FFFFFF"/>
    <rect x="-30" y="-30" width="18" height="14" fill="#E8871A"/>
    <rect x="-6" y="-30" width="18" height="14" fill="#E8871A"/>
    <rect x="14" y="-30" width="16" height="14" fill="#E8871A"/>
    <circle cx="-20" cy="22" r="8" fill="#E8871A"/>
    <circle cx="20" cy="22" r="8" fill="#E8871A"/>
  </g>

  <!-- Green pin: graduation cap -->
  <g transform="translate(824,340)">
    <path d="M 0 -80 C -44 -80 -80 -44 -80 0 C -80 56 0 120 0 120 C 0 120 80 56 80 0 C 80 -44 44 -80 0 -80 Z" fill="#2E8B57"/>
    <path d="M 0 -34 L 40 -14 L 0 6 L -40 -14 Z" fill="#FFFFFF"/>
    <path d="M -22 -4 L -22 14 Q 0 26 22 14 L 22 -4" fill="#FFFFFF"/>
    <path d="M 36 -10 L 36 16" stroke="#FFFFFF" stroke-width="5" fill="none"/>
    <circle cx="36" cy="20" r="5" fill="#FFFFFF"/>
  </g>

  <!-- Union Buildings silhouette (simplified dome + colonnade) -->
  <g class="navy" opacity="0.9">
    <rect x="352" y="420" width="320" height="80"/>
    <ellipse cx="512" cy="400" rx="60" ry="44"/>
    <rect x="500" y="330" width="24" height="40"/>
    <circle cx="512" cy="322" r="12"/>
    <!-- colonnade columns -->
    <rect x="372" y="440" width="14" height="60" fill="#FFFFFF"/>
    <rect x="404" y="440" width="14" height="60" fill="#FFFFFF"/>
    <rect x="436" y="440" width="14" height="60" fill="#FFFFFF"/>
    <rect x="574" y="440" width="14" height="60" fill="#FFFFFF"/>
    <rect x="606" y="440" width="14" height="60" fill="#FFFFFF"/>
    <rect x="638" y="440" width="14" height="60" fill="#FFFFFF"/>
    <!-- side wings -->
    <rect x="272" y="450" width="80" height="50"/>
    <rect x="672" y="450" width="80" height="50"/>
  </g>

  <!-- Minibus taxi (Toyota Quantum style silhouette) -->
  <g class="navy">
    <path d="M 152 620
             L 152 570
             Q 152 540 190 532
             L 400 508
             Q 470 500 540 508
             L 790 540
             Q 860 550 868 600
             L 868 640
             Q 868 656 852 656
             L 172 656
             Q 152 656 152 640 Z"/>
    <!-- windows -->
    <path d="M 200 548 L 380 530 L 380 590 L 200 590 Z" fill="#FFFFFF" opacity="0.85"/>
    <path d="M 410 528 L 560 528 L 560 590 L 410 590 Z" fill="#FFFFFF" opacity="0.85"/>
    <path d="M 590 532 L 750 550 L 750 590 L 590 590 Z" fill="#FFFFFF" opacity="0.85"/>
    <!-- wheels -->
    <circle cx="280" cy="656" r="44" fill="#1E3A5F"/>
    <circle cx="280" cy="656" r="20" fill="#FFFFFF"/>
    <circle cx="740" cy="656" r="44" fill="#1E3A5F"/>
    <circle cx="740" cy="656" r="20" fill="#FFFFFF"/>
    <!-- headlight -->
    <path d="M 840 580 L 866 590 L 866 612 L 840 606 Z" fill="#FCD34D"/>
  </g>

  <!-- Wordmark: Malume -->
  <text x="512" y="790" text-anchor="middle" font-family="DejaVu Sans" font-weight="800" font-size="120" fill="#1E3A5F">Malume</text>
  <!-- Wordmark: ScholarTrack -->
  <text x="512" y="900" text-anchor="middle" font-family="DejaVu Sans" font-weight="800" font-size="96"><tspan fill="#E8871A">Scholar</tspan><tspan fill="#2E8B57">Track</tspan></text>

  <!-- Tagline -->
  <text x="512" y="956" text-anchor="middle" font-family="DejaVu Sans" font-weight="600" font-size="30" letter-spacing="4" fill="#1E3A5F">SAFE ROUTES. SMARTER TOMORROWS.</text>

  <!-- Pretoria -->
  <text x="512" y="1000" text-anchor="middle" font-family="DejaVu Sans" font-weight="500" font-size="24" letter-spacing="6" fill="#1E3A5F">— PRETORIA —</text>
</svg>
